# Axes of the Security-of-Physical-AI matrix.
# Rows = ML/robotics pipeline stages. Columns = security objectives.
# Edit labels/descriptions here; the README is regenerated from this file.

stages:
  - id: data-collection
    label: Data collection
    desc: Sensing the physical world — cameras, LiDAR, radar, IMU/GPS, logs.
  - id: data-processing
    label: Data processing
    desc: Cleaning, labeling, curation and the data pipeline.
  - id: model-construction
    label: Model construction
    desc: Architecture, objective/reward design, IP.
  - id: model-training
    label: Model training
    desc: Optimization, (self-)supervision, RL, distributed/federated training.
  - id: model-deployment
    label: Model deployment
    desc: Packaging weights, releasing/serving the model on the robot/vehicle.
  - id: evaluation
    label: Evaluation
    desc: Benchmarks, test sets, simulation, red-teaming, certification.
  - id: inference
    label: Inference
    desc: Runtime perception → planning → action in the physical world.
  - id: system-architecture
    label: System architecture
    desc: Buses, components, APIs, networking across the cyber-physical system.

# Column order matters (renders left→right).
objectives:
  - Confidentiality
  - Integrity
  - Availability
  - Safety

# What each paper "does" — drives the count badges in every matrix cell.
kinds:
  attack:    { emoji: "🗡️",  label: Attack }
  defense:   { emoji: "🛡️",  label: Defense }
  benchmark: { emoji: "📊",  label: Benchmark / dataset / tool }
  survey:    { emoji: "📚",  label: Survey / SoK }

# Physical-AI platform / embodiment. Inferred per paper from `domains` (first
# category in `category_priority` whose `match` shares a domain wins). A paper
# may override with an explicit `category:` id. `general` is the fallback for
# platform-agnostic work (e.g. a training-time privacy or robustness defense).
categories:
  - id: av
    emoji: "🚗"
    label: Autonomous vehicle
    match: [autonomous-driving, lane-detection, lane-keeping, traffic-sign, hd-map, cooperative-perception, v2x, localization, planning, navigation, gps]
  - id: drone
    emoji: "🚁"
    label: Drone / UAV
    match: [drone, uav]
  - id: robot
    emoji: "🦾"
    label: Robot
    match: [robot-manipulation, robot-control, robot, reinforcement-learning]
  - id: vla
    emoji: "🤖"
    label: Embodied LLM / VLA
    match: [vla, vlm, embodied-llm, decision-making]
  - id: general
    emoji: "⚙️"
    label: Cross-cutting
    match: []

# Overlap resolution order (most specific first): a VLM-driven robot is VLA, a
# drone beats a generic robot, AV is broad so it comes late, general is last.
category_priority: [vla, drone, robot, av, general]
