    objectives: [Integrity, Availability]
    kind: defense
    domains: [distributed-training, federated]
    tldr: "Aggregation rule that tolerates Byzantine workers poisoning distributed/federated training."
    paper: "https://papers.nips.cc/paper/2017/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html"

  # ── Evaluation: simulation / safety testing tooling ────────────────────────
  - title: "CARLA: An Open Urban Driving Simulator"
